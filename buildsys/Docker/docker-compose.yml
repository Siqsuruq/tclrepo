version: '3.8'

services:
  ubuntu-builder:
    image: ubuntu:20.04
    container_name: bawt_glibc231_builder
    tty: true
    stdin_open: true
    volumes:
      - /opt/bawt:/workspace
    working_dir: /workspace
    environment:
      - DEBIAN_FRONTEND=noninteractive
    command: >
      bash -c "
      apt-get update && 
      apt-get install -y --no-install-recommends ca-certificates curl build-essential p7zip-full &&
      echo '=== Ubuntu 20.04 Builder Ready ===' &&
      bash"
